spring.application.name=tourism-backend

# PostgreSQL connection — override these via environment variables in production
spring.datasource.url=jdbc:postgresql://localhost:5433/dharmdev_tourism
spring.datasource.username=postgres
spring.datasource.password=3121
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate dialect is auto-detected for PostgreSQL with Spring Boot 3+
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
